<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nero</title>
    <script src="../appearance.js?v=interaction-quality-1"></script>
    <link rel="stylesheet" href="../appearance.css?v=neutral-surfaces-1" />
<link rel="stylesheet" href="../typography.css?v=ds-code-2">
<link rel="stylesheet" href="../components.css?v=ds-code-2">
<link rel="stylesheet" href="../style.css?v=ds-code-2" />
<link rel="stylesheet" href="../controls.css?v=ds-code-2">
<link rel="stylesheet" href="../desktop-preview.css?v=ds-code-2" />
<link rel="stylesheet" href="../windows-preview/bridge.css?v=ds-code-2" />






</head>
  <body>
    <div class="reviewbar">
      <strong>Nero 디자인 시안</strong><span>가상 데이터</span
      ><a href="?meetings=varied" class="fixture-link">다양한 사례</a
      ><a href="?meetings=many" class="fixture-link">많은 회의 보기</a
      ><a href="index.html" class="fixture-link">기본 시안</a
      ><a href="plan.html" target="_blank">기획과 사용 흐름</a
      ><button type="button" data-action="desktop:open" id="desktop-open">데스크톱 시안</button>
      <button id="review-toggle" type="button">상태 보기</button>
    </div>
    <div id="review" hidden></div>
    <div id="app"></div>
    <div id="modal-root"></div>
    <dialog
      id="settings-dialog"
      class="settings-dialog"
      aria-labelledby="settings-title"
    >
      <header class="settings-header">
        <h2 id="settings-title">설정</h2>
        <button
          type="button"
          id="settings-close"
          class="icon quiet"
          aria-label="설정 닫기"
        >
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </header>
      <fieldset class="appearance-options">
        <legend>밝기</legend>
        <div class="brightness-options">
          <label class="brightness-choice"
            ><input type="radio" name="appearance-mode" value="light" /><span
              >밝게</span
            ></label
          ><label class="brightness-choice"
            ><input type="radio" name="appearance-mode" value="dark" /><span
              >어둡게</span
            ></label
          ><label class="brightness-choice"
            ><input type="radio" name="appearance-mode" value="system" /><span
              >시스템</span
            ></label
          >
        </div>
      </fieldset>
      <fieldset class="appearance-options recent-preferences">
        <legend>최근 회의</legend>
        <div class="recent-preference-row"><span>기준</span><div class="brightness-options">
          <label class="brightness-choice"><input type="radio" name="recent-order" data-field="recent-order" value="opened" checked /><span>최근 열어본 순</span></label>
          <label class="brightness-choice"><input type="radio" name="recent-order" data-field="recent-order" value="date" /><span>회의 날짜순</span></label>
        </div></div>
        <div class="recent-preference-row"><span>표시 개수</span><div class="brightness-options">
          <label class="brightness-choice"><input type="radio" name="recent-limit" data-field="recent-limit" value="3" checked /><span>3개</span></label>
          <label class="brightness-choice"><input type="radio" name="recent-limit" data-field="recent-limit" value="5" /><span>5개</span></label>
          <label class="brightness-choice"><input type="radio" name="recent-limit" data-field="recent-limit" value="8" /><span>8개</span></label>
        </div></div>
      </fieldset>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <section id="desktop-root" hidden role="dialog" aria-modal="true" aria-labelledby="desktop-preview-title" tabindex="-1">
      <div id="desktop-view"></div>
      <div id="desktop-app-host" hidden>
        <header class="desktop-app-titlebar"><div><button type="button" data-action="desktop:hide-app" data-value="closed" aria-label="Nero 창 닫기" title="창 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button><button type="button" data-action="desktop:hide-app" data-value="minimized" aria-label="Nero 창 최소화" title="창 최소화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button></div><span>Nero</span></header>
      </div>
    </section>
    <script src="model.js?v=interaction-quality-1"></script>
    <script src="meeting-fixtures.js?v=interaction-quality-1"></script>
    <script src="../icons.js?v=interaction-quality-1"></script>
    <script src="../components.js?v=ds-code-2"></script>
    <script src="view-state.js?v=interaction-quality-1"></script>
    <script src="desktop-preview-model.js?v=single-row-title-link-1"></script>
    <script src="../desktop-preview-view.js?v=single-row-title-link-1"></script>
    <script src="desktop-preview.js?v=single-row-title-link-1"></script>
    <script src="../windows-preview/bridge.js?v=windows-design-1"></script>
    <script src="app.js?v=ds-code-2"></script>
  <script src="../controls.js?v=20261019-1608"></script>
</body>
</html>
