<html lang="ko" data-color="green" data-mode="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nero - Windows 시안</title><link rel="stylesheet" href="../appearance.css">

<body><header class="review-bar"><div><a href="../catalog/">Nero 디자인 시스템</a><span class="review-divider">/</span><strong>Windows</strong><span class="review-badge">브라우저 시안</span></div><div class="review-options"><label>밝기<select id="windows-mode"><option value="light">밝게</option><option value="dark">어둡게</option></select></label><a href="../prototype/index.html">macOS 시안</a></div></header>
<section class="review-scenarios" aria-label="Windows 시연 상황"><span>상황</span><button data-scenario="upcoming" aria-pressed="true">회의 알림</button><button data-scenario="recording" aria-pressed="false">녹음 중</button><button data-scenario="paused" aria-pressed="false">일시정지</button><button data-scenario="error" aria-pressed="false">마이크 끊김</button><button data-scenario="finished" aria-pressed="false">종료 후</button><button data-scenario="long" aria-pressed="false">긴 제목</button><button id="windows-advance" class="review-quiet">5분 경과</button><button id="windows-reset" class="review-quiet">창 위치 복원</button></section>
<main class="windows-desktop" id="windows-desktop" aria-label="Windows 데스크톱 시안">
<section class="app-window" id="app-window" aria-label="Nero 앱 창"><header class="window-titlebar" id="window-titlebar"><div class="window-title"><span data-icon="audio-lines"></span><span id="window-title-text">Nero</span></div><div class="window-caption"><button id="window-minimize" aria-label="창 최소화" title="최소화"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10" stroke-width="1" /></svg></button><button id="window-maximize" aria-label="창 최대화" title="최대화"><span data-icon="square"></span></button><button id="window-close" aria-label="창 닫기" title="닫기"><span data-icon="x"></span></button></div></header><div class="window-content"><iframe id="windows-app-frame" title="Nero 공통 제품 화면" src="../prototype/index.html?platform=windows&amp;session=windows-design"></iframe></div></section>
<div id="window-hidden-note" class="desktop-empty-note" hidden><strong>Nero 창이 닫혀 있습니다</strong><p>작업 표시줄이나 알림 영역에서 다시 열 수 있습니다.</p><button data-command="open">Nero 열기</button></div>
<section class="floating-recorder" id="floating-recorder" aria-label="부유 녹음 제어기" hidden><div class="recorder-main"><div class="recorder-grip" id="recorder-grip" title="드래그하여 이동"><span class="record-dot" id="record-dot"></span><time id="recording-time">00:00</time></div><button id="recorder-toggle" aria-label="일시정지" title="일시정지"></button><button id="recorder-stop" aria-label="녹음 종료" title="녹음 종료" data-icon="square"></button><button id="recorder-more" aria-label="녹음 메뉴" title="녹음 메뉴" aria-expanded="false" aria-controls="recorder-menu" data-icon="ellipsis"></button></div><div id="recorder-error" class="recorder-error" hidden><strong>마이크 연결이 끊겼습니다</strong><p>지금까지 녹음한 내용은 유지됩니다.</p><button data-command="retry">다시 연결</button></div><div id="recorder-menu" class="recorder-menu" hidden><strong id="recorder-title">10월 독서 모임</strong><button data-command="open">회의 열기</button><button id="recorder-hide">제어기 숨기기</button></div></section>
<section class="windows-toast" id="windows-toast" aria-label="Nero 회의 알림"><header><span data-icon="audio-lines"></span><span>Nero</span><span class="toast-time">지금</span><button id="toast-dismiss" aria-label="알림 닫기" data-icon="x"></button></header><button id="toast-body" class="toast-body"><strong id="toast-title">10월 독서 모임</strong><span id="toast-description">5분 후 시작합니다</span></button><footer id="toast-actions"><button id="toast-open">회의 준비</button><button id="toast-snooze">5분 뒤 알림</button></footer></section>
<section class="tray-flyout" id="tray-flyout" aria-label="Nero 알림 영역 메뉴" hidden><header><strong>Nero</strong><span id="tray-status">녹음 대기</span></header><p id="tray-title">10월 독서 모임</p><div id="tray-recording" hidden><div class="tray-time"><span>녹음 시간</span><time id="tray-time">00:00</time></div><div class="tray-actions"><button id="tray-toggle">일시정지</button><button data-command="stop">녹음 종료</button></div></div><button id="tray-retry" data-command="retry" class="tray-link" hidden>마이크 다시 연결</button><button data-command="open" class="tray-link">Nero 열기 <span class="key-hint">Ctrl+Shift+G</span></button><button id="tray-show-control" class="tray-link">녹음 제어기 보기</button></section>
<footer class="windows-taskbar"><div class="taskbar-left"><span class="desktop-label">Windows 시안</span></div><div class="taskbar-center"><button id="taskbar-nero" class="taskbar-app" aria-label="Nero 창 열기" title="Nero"><span data-icon="audio-lines"></span><span class="taskbar-app-name">Nero</span><i></i></button></div><div class="taskbar-right"><button id="tray-toggle-menu" class="tray-icon" aria-label="Nero 알림 영역 메뉴" title="Nero" aria-expanded="false" aria-controls="tray-flyout"><span data-icon="audio-lines"></span><i id="tray-dot" hidden></i></button><span class="taskbar-clock">오후 2:30<br>2026-10-19</span><button id="notification-toggle" class="tray-icon" aria-label="알림 다시 보기" title="알림"><span data-icon="messages-square"></span></button></div></footer>
</main><footer class="review-footer"><span>공통 제품 화면 / Windows 창, 알림 영역, 부유 녹음, 알림</span><span id="windows-feedback" role="status">브라우저 시연이며 OS 권한과 마이크를 사용하지 않습니다.</span></footer>
<dialog id="windows-dialog" aria-labelledby="windows-dialog-title"></dialog><script src="../icons.js"></script><script src="windows.js?v=ds-code-2"></script><script src="../controls.js?v=20261019-1608"></script>
</body></html>
