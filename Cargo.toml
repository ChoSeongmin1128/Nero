[workspace]
members = ["crates/nero-core", "crates/nero-cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "none"
