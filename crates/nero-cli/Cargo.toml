[package]
name = "nero-cli"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "nero"
path = "src/main.rs"

[dependencies]
fs2 = "0.4.3"
grove-core = { path = "../grove-core" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { version = "=1.53.3", features = ["rt", "io-std", "io-util", "time"] }

[dev-dependencies]
tempfile = "3.0"
