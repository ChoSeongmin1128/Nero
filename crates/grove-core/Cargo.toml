[package]
name = "grove-core"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
cpal = "=0.18.2"
fs2 = "0.4.3"
hound = "3.5.1"
pulldown-cmark = { version = "=0.13.0", default-features = false }
rtrb = "=0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
