name: Desktop checks

on:
  workflow_dispatch:
    inputs:
      build_windows_installer:
        description: Build an unsigned Windows NSIS installer without installing or publishing it
        type: boolean
        default: false
      use_dependency_cache:
        description: Reuse dependency downloads; disable for a cold verification run
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - '.cargo/config.toml'
      - '.gitattributes'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/nero-core/**'
      - 'crates/nero-cli/**'
      - 'apps/desktop/**'
      - 'design-system/**'
      - 'scripts/native-summary/**'
      - 'scripts/native-diarization/**'
      - 'scripts/native-whisper/**'
      - 'vendor/symphonia-codec-aac/**'
      - 'scripts/audio-prepare/**'
      - 'scripts/native-moss-harness/**'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUSTUP_TOOLCHAIN: stable
  CARGO_HOME: ${{ github.workspace }}/.work/ci-dependencies/cargo
  npm_config_cache: ${{ github.workspace }}/.work/ci-dependencies/npm

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare Windows MSVC x64 environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $locator -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC build tools are missing.' }
          $developerCommand = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $developerCommand -PathType Leaf)) { throw 'MSVC developer environment is missing.' }
          $developerEnvironment = & $env:ComSpec /d /s /c "call `"$developerCommand`" -no_logo -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the MSVC x64 environment.' }
          $buildVariables = @('INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VSINSTALLDIR', 'VisualStudioVersion',
            'VCToolsInstallDir', 'VCToolsRedistDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion',
            'WindowsSDKLibVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_VER')
          foreach ($entry in $developerEnvironment) {
            if ($entry -match '^([^=]+)=(.*)$' -and ($Matches[1] -eq 'Path' -or $Matches[1] -in $buildVariables)) {
              $variableName = $Matches[1]
              $variableValue = $Matches[2]
              [Environment]::SetEnvironmentVariable($variableName, $variableValue, 'Process')
              if ($variableName -ne 'Path') {
                "$variableName=$variableValue" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }
          $buildPaths = @($env:Path -split ';' | Where-Object { $_ })
          # The runner prepends GITHUB_PATH entries in reverse order.
          [array]::Reverse($buildPaths)
          $buildPaths | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $compiler = Get-Command cl.exe -CommandType Application -ErrorAction Stop
          $expectedCompiler = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\cl.exe'
          if ($compiler.Source -ne $expectedCompiler) { throw 'The compiler is outside the selected MSVC x64 toolchain.' }
          $linker = Join-Path (Split-Path -Path $compiler.Source -Parent) 'link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) { throw 'The selected MSVC x64 linker is missing.' }
          # Git Bash prepended its own link.exe despite GITHUB_PATH; bind Cargo to MSVC explicitly.
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = $linker
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare native Rust toolchain
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc -Vv
          cargo -V
          node --version
          npm --version
          echo "cargo=$(cargo -V)" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm=$(npm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore npm downloads
        id: npm-downloads
        if: github.event_name != 'workflow_dispatch' || inputs.use_dependency_cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .work/ci-dependencies/npm/_cacache
          key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-npm-${{ steps.toolchain.outputs.node }}-${{ steps.toolchain.outputs.npm }}-${{ hashFiles('apps/desktop/package-lock.json') }}
      - name: Restore Cargo downloads
        id: cargo-downloads
        if: github.event_name != 'workflow_dispatch' || inputs.use_dependency_cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .work/ci-dependencies/cargo/registry/index/index.crates.io-*
            .work/ci-dependencies/cargo/registry/cache/index.crates.io-*
          key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cargo }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check product version manifests
        working-directory: apps/desktop
        run: npm run version:check
      - name: Check shared design system and native consumers
        run: |
          node design-system/checks/check-design-contracts.cjs
          node --test design-system/checks/check-components.cjs
          node design-system/checks/check-windows-bridge.cjs
          node design-system/catalog/check-tokens.cjs
      - name: Check frontend behavior
        working-directory: apps/desktop
        run: npm test
      - name: Build shared frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Test recording core with synthetic input
        run: cargo test -p nero-core --locked -- --test-threads=1
      - name: Test read-only CLI and MCP
        run: cargo test -p nero-cli --locked -- --test-threads=1
      - name: Bundle read-only agent
        working-directory: apps/desktop
        run: npm run prepare:agent
      - name: Verify Windows agent has no external MSVC runtime dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $locator -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'MSVC inspection tools are missing.' }
          $versions = @(Get-ChildItem -LiteralPath (Join-Path $installation 'VC/Tools/MSVC') -Directory | Sort-Object -Property { [version]$_.Name } -Descending)
          if ($versions.Count -eq 0) { throw 'MSVC inspection tools are missing.' }
          $dumpbin = Join-Path $versions[0].FullName 'bin/Hostx64/x64/dumpbin.exe'
          $dependencies = & $dumpbin /DEPENDENTS apps/desktop/.generated/agent/nero.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the Windows agent.' }
          if ($dependencies -match '(?i)\b(?:vcruntime|msvcp|concrt|vcomp)\d[^\s]*\.dll\b') {
            throw 'The standalone agent still needs an external MSVC runtime DLL.'
          }
      - name: Bundle pinned summary runtime
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python scripts/native-summary/prepare.py --target windows-x64
          else
            python3 scripts/native-summary/prepare.py --target macos-arm64
          fi
      - name: Bundle pinned Windows speech runtime
        # Version startup checks do not load model weights or qualify inference.
        if: runner.os == 'Windows'
        run: |
          python scripts/native-diarization/prepare.py --target windows-x64
          python scripts/native-diarization/prepare.py --verify-staged apps/desktop/.generated/native/diarization --target windows-x64 --execute-runtime
      - name: Bundle pinned Windows Whisper runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/native-whisper/prepare.py --prepare-tools
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare pinned Whisper build tools.' }
          python scripts/native-whisper/prepare.py --target windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the pinned Windows Whisper runtime.' }
          python scripts/native-whisper/prepare.py --verify-staged apps/desktop/.generated/native/whisper --target windows-x64 --execute-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the Windows Whisper runtime.' }
      - name: Bundle pinned macOS Whisper runtime
        if: runner.os == 'macOS'
        run: |
          python3 scripts/native-whisper/prepare.py --target macos-arm64
          python3 scripts/native-whisper/prepare.py --verify-staged apps/desktop/.generated/native/whisper --target macos-arm64 --execute-runtime
      - name: Test Whisper packaging contract
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -B -m unittest discover -s scripts/native-whisper -p 'test_*.py'
          else
            python3 -B -m unittest discover -s scripts/native-whisper -p 'test_*.py'
          fi
      - name: Verify pinned summary package
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python scripts/native-summary/prepare.py --target windows-x64 --verify-staged apps/desktop/.generated/native/summary --execute-runtime
          else
            python3 scripts/native-summary/prepare.py --target macos-arm64 --verify-staged apps/desktop/.generated/native/summary
          fi
      - name: Test summary packaging contract
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -B -m unittest discover -s scripts/native-summary -p 'test_*.py'
          else
            python3 -B -m unittest discover -s scripts/native-summary -p 'test_*.py'
          fi
      - name: Test checked MOSS runtime build contract
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/native-moss-harness -p 'test_*.py'
      - name: Test native processing
        run: cargo test -p nero-desktop --locked -- --test-threads=1
      - name: Check native desktop host
        run: cargo check -p nero-desktop --locked
      - name: Build Windows installer
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.build_windows_installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis --ci --no-sign -- --locked
      - name: Check Windows installer output
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.build_windows_installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path '.work/rust-target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw 'No NSIS installer was produced.' }
          $installers | Select-Object Name, Length
      - name: Test Windows installer running-app protection
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.build_windows_installer
        env:
          NERO_REQUIRE_NSIS_TESTS: '1'
        run: python -B -m unittest discover -s apps/desktop/tests -p test_windows_installer.py -v
      # Only reviewed default-branch dispatches populate caches; PRs restore downloads only.
      - name: Save npm downloads
        if: success() && github.event_name == 'workflow_dispatch' && inputs.use_dependency_cache && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.npm-downloads.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .work/ci-dependencies/npm/_cacache
          key: ${{ steps.npm-downloads.outputs.cache-primary-key }}
      - name: Save Cargo downloads
        if: success() && github.event_name == 'workflow_dispatch' && inputs.use_dependency_cache && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-downloads.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .work/ci-dependencies/cargo/registry/index/index.crates.io-*
            .work/ci-dependencies/cargo/registry/cache/index.crates.io-*
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}
      - name: Report dependency cache mode
        if: always()
        env:
          CACHE_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.use_dependency_cache }}
          NPM_CACHE_HIT: ${{ steps.npm-downloads.outputs.cache-hit }}
          CARGO_CACHE_HIT: ${{ steps.cargo-downloads.outputs.cache-hit }}
        run: |
          printf '| Dependency downloads | Exact hit |\n| --- | --- |\n| npm | %s |\n| Cargo | %s |\n\nCache enabled: %s. Full install, build and test commands remain active.\n' "${NPM_CACHE_HIT:-false}" "${CARGO_CACHE_HIT:-false}" "$CACHE_ENABLED" >> "$GITHUB_STEP_SUMMARY"
