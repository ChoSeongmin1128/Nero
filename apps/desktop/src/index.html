<!doctype html>
<html lang="ko" data-appearance-storage="nero.appearance.v1">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nero</title>
    <script src="/shared/appearance.js"></script>
    <link rel="stylesheet" href="/shared/appearance.css">
    <link rel="stylesheet" href="/shared/typography.css">
    <link rel="stylesheet" href="/shared/components.css">
    <link rel="stylesheet" href="/shared/controls.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/agent-connections.css">
    <link rel="stylesheet" href="/speakers.css">
    <link rel="stylesheet" href="/transcript-actions.css">
    <link rel="stylesheet" href="/document-tools.css">
    <script src="/shared/icons.js"></script>
    <script src="/shared/components.js"></script>
  </head>
  <body>
    <div class="workspace navigation-shell">
      <nav class="navigation-rail" aria-label="빠른 탐색"><div class="navigation-rail-head"><button id="navigation-toggle" type="button" class="quiet small icon" aria-controls="navigation-sidebar" aria-expanded="false" aria-label="사이드바 열기"></button></div><button id="rail-new-meeting" type="button" aria-label="새 회의" title="새 회의" disabled><span data-detail-icon="plus" aria-hidden="true"></span></button><button id="rail-library" type="button" aria-label="회의 목록" title="회의 목록"><span data-detail-icon="notebook-pen" aria-hidden="true"></span></button><button id="rail-settings" type="button" aria-label="설정" title="설정"><span data-detail-icon="settings" aria-hidden="true"></span></button></nav>
      <aside id="navigation-sidebar" class="library navigation-sidebar" aria-label="회의 목록">
        <header class="library-header"><div class="navigation-brand"><strong class="brand"><img src="/brand/mark.svg" width="28" height="28" alt="">Nero</strong></div><div class="new-meeting-split"><button id="create-meeting" class="primary with-icon" type="button" disabled>새 회의</button><details id="new-meeting-menu" class="meeting-menu new-meeting-menu" data-meeting-menu><summary id="create-meeting-options" aria-label="새 회의 옵션" title="새 회의 옵션" aria-disabled="true"><span data-detail-icon="chevron-down" aria-hidden="true"></span></summary><div class="action-menu"><button id="create-calendar-meeting" type="button" disabled><span data-detail-icon="calendar-days" aria-hidden="true"></span><span>일정으로 만들기</span></button></div></details></div></header>
        <div class="library-actions"><button id="import-audio" type="button" class="quiet small" disabled>음성 가져오기</button></div>
        <label class="search-field"><span class="sr-only">회의 검색</span><input id="search" class="text-input text-input--compact" type="search" placeholder="회의 검색" autocomplete="off"></label>
        <div class="library-navigation"><div class="library-heading"><h2>회의</h2><button id="new-folder" class="quiet small" type="button" aria-label="새 폴더">새 폴더</button></div>
        <nav id="folder-list" class="folder-list" aria-label="회의 분류"></nav><details id="recent-section" class="recent-section" open hidden><summary id="recent-heading"><span data-detail-icon="chevron-down" aria-hidden="true"></span><span>최근 회의</span></summary><nav id="recent-meetings" class="recent-meetings" aria-label="최근 회의"></nav></details></div>
        <footer class="library-footer"><button id="settings" class="quiet small with-icon" type="button" aria-label="설정" title="설정"><span data-detail-icon="settings" aria-hidden="true"></span><span>설정</span></button></footer>
      </aside>
      <main class="main-content navigation-content"><header class="navigation-toolbar"><nav id="navigation-breadcrumbs" class="navigation-breadcrumbs" aria-label="현재 위치"></nav></header>
        <div id="error" class="notice app-error" role="alert" hidden><span id="error-message"></span><button id="retry-save" class="small" type="button" hidden>다시 저장</button><button id="dismiss-error" class="quiet small icon" type="button" data-ui-icon="x" aria-label="오류 안내 닫기" title="오류 안내 닫기"><span class="sr-only">오류 안내 닫기</span></button></div>
        <div id="processing" class="processing-notice" hidden><span id="processing-spinner" class="activity-spinner" aria-hidden="true"></span><span id="processing-result-icon" class="processing-result-icon" aria-hidden="true" hidden></span><div class="processing-copy" role="status"><strong id="processing-title"></strong><span id="processing-message"></span><details id="processing-error-info" class="type-caption" hidden><summary>오류 정보</summary><div id="processing-error-fields"></div></details></div><progress id="processing-progress" aria-label="모델 다운로드 진행률" hidden></progress><span id="processing-percent" class="type-caption" hidden></span><button id="cancel-processing" type="button" class="quiet small">취소</button><button id="retry-processing" type="button" class="small" hidden>다시 시도</button><button id="open-processing-meeting" type="button" class="quiet small" hidden>회의 열기</button><button id="dismiss-processing" type="button" class="quiet small" hidden>알림 닫기</button><p id="processing-warning" class="processing-warning type-caption" role="status" hidden></p></div>
        <section id="processing-jobs" class="processing-jobs" aria-label="처리 상태 알림" hidden></section>
        <section id="setup-screen" class="setup-screen" aria-labelledby="setup-title" hidden>
          <div class="setup-content">
            <header class="setup-header"><img class="setup-logo" src="/brand/mark.svg" width="40" height="40" alt=""><div><span class="setup-app-name">Nero</span><h1 id="setup-title" tabindex="-1">초기 설정</h1></div></header>
            <div class="setup-models" role="group" aria-label="다운로드할 기능">
                <div class="setup-model setup-model-required">
                  <span class="setup-feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/></svg></span>
                  <strong>음성 인식</strong><span class="setup-required-label">필수</span><span id="setup-speech-state" class="setup-model-state"></span>
                </div>
                <div class="setup-model setup-model-optional">
                  <span class="setup-feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5"/></svg></span>
                  <strong>회의 요약</strong>
                  <div class="setup-summary-actions"><span id="setup-summary-state" class="setup-model-state"></span><label id="setup-summary-choice" class="setup-choice"><input id="setup-summary-option" type="checkbox" aria-label="요약 모델 함께 다운로드"><span>함께 다운로드</span></label><button id="setup-download-summary" type="button" class="small" hidden>요약 모델 다운로드</button></div>
                </div>
            </div>
            <div id="setup-progress-region" class="setup-progress-region" hidden><progress id="setup-progress" aria-label="모델 준비 진행률"></progress><div class="setup-progress-meta"><span class="processing-inline" role="status"><span id="setup-spinner" class="activity-spinner" aria-hidden="true" hidden></span><span id="setup-progress-stage"></span></span><span id="setup-progress-bytes"></span></div></div>
            <p id="setup-message" class="setup-message" role="status">준비 상태 확인 중</p><div class="setup-actions"><button id="setup-download" class="primary" type="button" disabled>다운로드</button><button id="setup-cancel" class="quiet" type="button" hidden>취소</button><button id="setup-start" class="primary" type="button" hidden>새 회의</button><button id="setup-back" class="quiet" type="button" hidden>회의로 돌아가기</button></div>
          </div>
        </section>
        <section id="library-screen" class="library-screen" aria-labelledby="library-title" hidden>
          <header class="library-screen-header"><div><h1 id="library-title" tabindex="-1">회의 목록</h1><span id="library-count" class="type-caption muted"></span></div><div class="library-list-actions"><div id="library-view" class="library-view" role="group" aria-label="회의 보기"><button type="button" class="quiet small" data-library-view="folders" aria-pressed="true">폴더별</button><button type="button" class="quiet small" data-library-view="all" aria-pressed="false">전체 회의</button></div><button id="library-empty-trash" type="button" class="quiet small with-icon danger-text" hidden><span data-detail-icon="trash-2" aria-hidden="true"></span><span>휴지통 비우기</span></button><div id="library-batch" class="library-batch" role="group" aria-label="선택한 회의 작업" hidden><span id="library-selected-count" role="status"></span><button id="library-select-all" type="button" class="quiet small">전체 선택</button><span class="library-batch-divider" aria-hidden="true"></span><button id="library-move" type="button" class="quiet small icon" data-ui-icon="folder-input" aria-label="폴더로 이동" title="폴더로 이동"></button><button id="library-trash" type="button" class="quiet small icon danger-text" data-ui-icon="trash-2" aria-label="휴지통으로 이동" title="휴지통으로 이동"></button><button id="library-restore" type="button" class="quiet small icon" data-ui-icon="undo-2" aria-label="복원" title="복원" hidden></button><button id="library-purge" type="button" class="quiet small icon danger-text" data-ui-icon="trash-2" aria-label="영구 삭제" title="영구 삭제" hidden></button><span class="library-batch-divider" aria-hidden="true"></span><button id="library-selection-clear" type="button" class="quiet small icon" data-ui-icon="x" aria-label="선택 해제" title="선택 해제"></button></div></div></header>
          <p id="library-search-status" class="muted type-caption" role="status" hidden></p>
          <nav id="library-folders" class="library-folders" aria-label="폴더" hidden></nav><h2 id="library-unfiled-heading" class="library-unfiled-heading" hidden>미분류</h2><nav id="meeting-list" class="meeting-list" aria-label="저장한 회의"></nav><span id="meeting-count" class="sr-only"></span>
        </section>
        <section id="welcome" class="welcome" hidden><div class="welcome-icon" aria-hidden="true"></div><h1>회의를 시작하세요</h1><p id="welcome-message">새 회의를 만들어 녹음하고 메모를 남기세요.</p><button id="welcome-create" class="primary with-icon" type="button" disabled>새 회의</button></section>
        <section id="meeting-detail" class="meeting-detail" tabindex="-1" hidden aria-label="회의 내용">
          <div class="detail-common">
          <header class="detail-header"><div class="detail-library-actions"><div class="detail-return" hidden><button id="library-back" type="button" class="quiet small">회의 목록</button><span id="meeting-folder-context"></span></div><div class="row"><button id="detail-transcript-open" type="button" class="quiet small with-icon" aria-controls="detail-inspector" aria-expanded="false"><span data-detail-icon="notebook-tabs" aria-hidden="true"></span><span>음성 기록</span></button><button id="detail-notes-open" type="button" class="quiet small with-icon" aria-controls="detail-inspector" aria-expanded="false"><span data-detail-icon="notebook-pen" aria-hidden="true"></span><span>메모</span></button><button id="document-search-toggle" type="button" class="quiet small icon" aria-expanded="false" aria-controls="document-search" data-ui-icon="search" aria-label="내용 검색" title="내용 검색"><span class="sr-only">내용 검색</span></button><span id="summary-document-actions"></span><details class="meeting-menu detail-more" data-meeting-menu><summary aria-label="회의 더보기" title="회의 더보기"><span data-detail-icon="ellipsis" aria-hidden="true"></span></summary><div class="action-menu"><button id="meeting-move" type="button" class="quiet small">폴더 이동</button><button id="meeting-trash" type="button" class="quiet small danger-text">휴지통으로 이동</button></div></details></div></div>
            <div class="detail-title-row"><label class="sr-only" for="meeting-title">회의 제목</label><input id="meeting-title" class="text-input text-input--title meeting-title" type="text" placeholder="회의 제목" maxlength="200" autocomplete="off"><span id="meeting-status"></span></div>
            <div id="calendar-meeting-reference" hidden></div><div class="detail-context"><div class="meeting-day-field"><label class="sr-only" for="meeting-day">회의 날짜</label><input id="meeting-day" data-field="meeting-day" type="date"></div><div class="meeting-timestamps muted type-caption"><span id="recorded-at" hidden></span></div><div class="detail-actions"><span id="save-spinner" class="activity-spinner" aria-hidden="true" hidden></span><span id="save-status" class="muted type-caption" role="status" hidden></span></div></div>
            <span id="meeting-date-message" class="meeting-date-message type-caption" role="status" hidden></span>
          </header>
          <section class="recording-section" aria-label="녹음">
            <div class="recording-toolbar"><div class="recording-heading"><span id="recording-icon" aria-hidden="true"></span><h2>녹음</h2><span id="recording-time" class="type-timer" hidden>00:00</span></div><div class="recording-actions"><div id="recording-controls" class="recording-controls"></div></div></div>
            <p id="recording-message" class="muted type-caption" hidden></p>
            <div id="recording-quality" class="recording-quality" hidden></div>
            <div id="audio-region" class="audio-region" hidden>
              <audio id="audio-player" preload="metadata" aria-label="회의 녹음" hidden disableRemotePlayback></audio>
              <div class="audio-controls" role="group" aria-label="녹음 재생">
                <button id="audio-toggle" type="button" class="quiet small audio-toggle" aria-label="재생" disabled><span id="audio-toggle-icon" aria-hidden="true"></span><span id="audio-toggle-label" class="sr-only">재생</span></button>
                <div class="audio-timeline">
                  <input id="audio-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="재생 위치" aria-valuetext="0초" disabled>
                  <div class="audio-time type-caption"><span id="audio-current" aria-label="현재 시간">0:00</span><span id="audio-duration" aria-label="전체 시간">0:00</span></div>
                </div>
                <select id="audio-speed" aria-label="재생 속도" disabled>
                  <option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
                </select>
                <button id="audio-mute" type="button" class="quiet small icon" aria-label="음소거" aria-pressed="false" disabled>음소거</button>
              </div>
              <p id="audio-player-status" class="muted type-caption" role="status" hidden></p>
              <p id="audio-message" class="muted type-caption"></p><button id="retry-audio" type="button" class="quiet small" hidden>다시 열기</button>
              <script type="module" src="/audio-player.js"></script>
            </div>
          </section>

          </div>
          <div class="detail-primary">
          <div id="detail-search-home"></div>
          <div id="document-search" class="document-search" role="search" aria-label="회의 내용 검색" hidden><label><span class="sr-only">검색어</span><input id="document-query" class="text-input text-input--compact" type="search" placeholder="회의 내용 검색" autocomplete="off"></label><span id="document-search-count" class="type-caption muted" role="status"></span><button id="document-search-prev" type="button" class="quiet small icon" data-ui-icon="chevron-up" aria-label="이전 검색 결과" title="이전 검색 결과"><span class="sr-only">이전 검색 결과</span></button><button id="document-search-next" type="button" class="quiet small icon" data-ui-icon="chevron-down" aria-label="다음 검색 결과" title="다음 검색 결과"><span class="sr-only">다음 검색 결과</span></button><button id="document-search-close" type="button" class="quiet small icon" data-ui-icon="x" aria-label="내용 검색 닫기" title="내용 검색 닫기"><span class="sr-only">내용 검색 닫기</span></button></div>
          <div class="detail-panels">
            <section id="summary-section" class="summary-section detail-panel" role="region" aria-label="요약" tabindex="0">
              <div class="section-heading detail-panel-toolbar"><h2>요약</h2><div class="row"><button id="prepare-summary" type="button" class="small" hidden>요약 기능 준비</button><span id="summary-template-choice"><select id="summary-template" aria-label="요약 템플릿" disabled><option>템플릿 확인 중</option></select></span><button id="summarize" type="button" class="small primary" disabled>요약하기</button></div></div>
              <button id="retry-summary-load" type="button" class="small" hidden>다시 불러오기</button><p id="summary-message" class="muted type-caption" role="status"></p><div id="summary-content" class="summary-content"></div>
            </section>
          </div>
          </div>
          <aside id="detail-inspector" class="detail-inspector" aria-labelledby="detail-inspector-title" hidden>
            <header class="inspector-header"><h2 id="detail-inspector-title">음성 기록</h2><button id="inspector-audio-toggle" type="button" class="quiet small" aria-label="녹음 재생" disabled>재생</button><button id="inspector-search-toggle" type="button" class="quiet small" aria-controls="document-search" aria-expanded="false">검색</button><button id="detail-inspector-close" type="button" class="quiet small icon" aria-label="요약으로 돌아가기" title="닫기"><span class="inspector-back">요약으로</span><span class="inspector-close-icon" data-ui-icon="x" aria-label="닫기" aria-hidden="true"></span></button></header>
            <p id="inspector-audio-status" class="inspector-audio-status muted type-caption" role="status" hidden></p>
            <div id="summary-evidence" class="summary-evidence" hidden></div>
            <section id="transcript-section" class="transcript-section detail-panel" role="region" aria-label="음성 기록" tabindex="0" hidden>
              <div class="section-heading transcript-heading detail-panel-toolbar"><h2 class="sr-only">음성 기록</h2><div class="row"><button id="speakers-button" type="button" class="small quiet" hidden>화자 편집</button><button id="transcribe" type="button" class="small primary" disabled>텍스트로 변환</button><button id="transcript-history" type="button" class="small quiet" hidden>이전 기록</button><button id="save-transcript" type="button" class="small" disabled>수정 저장</button><span id="transcript-document-actions"></span></div></div>
              <button id="retry-transcript-load" type="button" class="small" hidden>다시 불러오기</button><div id="transcript-scroll" class="transcript-scroll" tabindex="0"><p id="transcript-message" class="muted type-caption"></p><div id="transcript-rows"></div></div>
            </section>
            <section id="notes-section" class="notes-section detail-panel" role="region" aria-label="메모" tabindex="0" hidden><div class="section-heading"><h2 class="sr-only"><label for="meeting-notes">메모</label></h2></div><div id="notes-search-preview" class="notes-search-preview" role="region" tabindex="0" aria-label="메모 검색 결과" hidden></div><textarea id="meeting-notes" class="text-input" placeholder="안건이나 기억할 내용을 적어 두세요." spellcheck="false"></textarea></section>
          </aside>
        </section>
      </main>
    </div>
    <span id="copy-feedback" class="sr-only" role="status"></span>
    <dialog id="settings-dialog" class="settings-dialog app-settings-dialog" aria-labelledby="settings-title">
      <header class="settings-header"><h2 id="settings-title">설정</h2><button id="settings-close" class="quiet small icon" type="button" data-ui-icon="x" aria-label="설정 닫기" title="설정 닫기"><span class="sr-only">설정 닫기</span></button></header>
      <div class="app-settings-body">
        <nav class="app-settings-tabs settings-navigation" role="tablist" aria-label="설정 분류" aria-orientation="vertical">
          <button id="settings-appearance-tab" type="button" role="tab" data-settings-panel="appearance" aria-selected="true" aria-controls="settings-appearance-panel">일반</button>
          <button id="settings-recording-tab" type="button" role="tab" data-settings-panel="recording" aria-selected="false" aria-controls="settings-recording-panel" tabindex="-1">녹음</button>
          <button id="settings-agent-tab" type="button" role="tab" data-settings-panel="agent" aria-selected="false" aria-controls="settings-agent-panel" tabindex="-1">연동</button>
          <button id="settings-templates-tab" type="button" role="tab" data-settings-panel="templates" aria-selected="false" aria-controls="settings-templates-panel" tabindex="-1">요약 템플릿</button>
        </nav>
        <div class="app-settings-content">
          <section id="settings-recording-panel" role="tabpanel" aria-labelledby="settings-recording-tab" hidden>
            <h3 class="settings-panel-title">녹음</h3>
            <div class="settings-group settings-recording-device">
            <label class="app-settings-label" for="settings-microphone">녹음 마이크</label>
            <div class="settings-microphone-control">
              <select id="settings-microphone" data-field="settings-microphone" aria-label="녹음 마이크"><option value="">시스템 기본 마이크</option></select>
              <button id="settings-refresh-devices" type="button" class="icon" aria-label="마이크 목록 새로고침" title="마이크 목록 새로고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.74-6.26L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.74 6.26L3 16M8 16H3v5"/></svg></button>
            </div>
            </div>
            <div class="settings-group settings-recording-options">
            <label class="setup-choice settings-row"><span>녹음 중 제어창 항상 표시</span><input id="auto-recorder" type="checkbox" checked></label>
            <label id="settings-terminology-row" class="setup-choice settings-row" hidden><span>용어 자동 정리</span><input id="terminology-enabled" type="checkbox" disabled></label>
            </div>
          </section>
          <section id="settings-appearance-panel" role="tabpanel" aria-labelledby="settings-appearance-tab">
            <h3 class="settings-panel-title">일반</h3>
            <fieldset class="appearance-options">
              <legend>밝기</legend>
              <div class="brightness-options">
                <label class="brightness-choice"><input type="radio" name="appearance-mode" value="light"><span>밝게</span></label>
                <label class="brightness-choice"><input type="radio" name="appearance-mode" value="dark"><span>어둡게</span></label>
                <label class="brightness-choice"><input type="radio" name="appearance-mode" value="system"><span>시스템</span></label>
              </div>
            </fieldset>
            <fieldset class="appearance-options">
              <legend>색상</legend>
              <div class="theme-grid">
                <label class="theme-option"><input type="radio" name="appearance-color" value="green">
                  <span class="theme-preview" data-theme-preview="green" aria-hidden="true"><span class="preview-sidebar"><i></i><i></i><i></i></span><span class="preview-document"><b></b><i></i><i></i><i></i><em></em></span></span>
                  <span class="theme-caption"><strong>녹색</strong></span>
                </label>
                <label class="theme-option"><input type="radio" name="appearance-color" value="blue">
                  <span class="theme-preview" data-theme-preview="blue" aria-hidden="true"><span class="preview-sidebar"><i></i><i></i><i></i></span><span class="preview-document"><b></b><i></i><i></i><i></i><em></em></span></span>
                  <span class="theme-caption"><strong>파랑</strong></span>
                </label>
                <label class="theme-option"><input type="radio" name="appearance-color" value="purple">
                  <span class="theme-preview" data-theme-preview="purple" aria-hidden="true"><span class="preview-sidebar"><i></i><i></i><i></i></span><span class="preview-document"><b></b><i></i><i></i><i></i><em></em></span></span>
                  <span class="theme-caption"><strong>보라</strong></span>
                </label>
                <label class="theme-option"><input type="radio" name="appearance-color" value="mono">
                  <span class="theme-preview" data-theme-preview="mono" aria-hidden="true"><span class="preview-sidebar"><i></i><i></i><i></i></span><span class="preview-document"><b></b><i></i><i></i><i></i><em></em></span></span>
                  <span class="theme-caption"><strong>흑백</strong></span>
                </label>
                <label class="theme-option"><input type="radio" name="appearance-color" value="amber">
                  <span class="theme-preview" data-theme-preview="amber" aria-hidden="true"><span class="preview-sidebar"><i></i><i></i><i></i></span><span class="preview-document"><b></b><i></i><i></i><i></i><em></em></span></span>
                  <span class="theme-caption"><strong>황토</strong></span>
                </label>
                <label class="theme-option"><input type="radio" name="appearance-color" value="rose">
                  <span class="theme-preview" data-theme-preview="rose" aria-hidden="true"><span class="preview-sidebar"><i></i><i></i><i></i></span><span class="preview-document"><b></b><i></i><i></i><i></i><em></em></span></span>
                  <span class="theme-caption"><strong>장미</strong></span>
                </label>
              </div>
            </fieldset>
            <section class="settings-feature-section" aria-labelledby="settings-features-title">
              <h4 id="settings-features-title" class="settings-subtitle">추가 기능</h4>
              <div class="settings-group"><div class="settings-row"><span>회의 요약</span><span id="settings-summary-control" class="settings-feature-control" tabindex="-1"><span id="settings-summary-state" class="muted type-caption"></span><button id="models" type="button" class="small">추가</button></span></div></div>
              <p id="settings-summary-error" class="notice type-caption" role="alert" hidden></p>
              <div id="settings-summary-progress" class="settings-feature-progress" hidden><progress id="settings-feature-progress" aria-label="회의 요약 기능 다운로드"></progress><span id="settings-feature-stage" class="muted type-caption" role="status"></span><button id="settings-feature-cancel" type="button" class="quiet small">취소</button></div>
            </section>
          </section>
          <section id="settings-agent-panel" role="tabpanel" aria-labelledby="settings-agent-tab" hidden>
            <h3 class="settings-panel-title">연동</h3>
            <h4 class="settings-subtitle">AI 에이전트</h4>
            <div class="settings-group settings-clients">
            <div class="settings-client-row">
              <span class="settings-client-name">Claude</span>
              <div class="settings-client-controls"><div class="settings-client-meta"><span id="settings-claude-spinner" class="activity-spinner" aria-hidden="true" hidden></span><span id="settings-claude-status" class="settings-client-status" role="status">확인 중</span></div><button id="settings-claude-connect" type="button" class="small" aria-label="Claude 연결" disabled>연결</button></div>
              <p id="settings-claude-error" class="notice" role="alert" hidden></p>
            </div>
            <div class="settings-client-row">
              <span class="settings-client-name">ChatGPT</span>
              <div class="settings-client-controls"><div class="settings-client-meta"><span id="settings-codex-spinner" class="activity-spinner" aria-hidden="true" hidden></span><span id="settings-codex-status" class="settings-client-status" role="status">확인 중</span></div><button id="settings-codex-connect" type="button" class="small" aria-label="ChatGPT 연결" disabled>연결</button></div>
              <p id="settings-codex-error" class="notice" role="alert" hidden></p>
            </div>
            <div class="settings-agent-alternative">
              <div class="settings-agent-alternative-copy"><strong>다른 에이전트</strong><span>Claude Code, Cursor 등</span></div>
              <button id="settings-agent-manual" type="button" class="small" aria-label="다른 에이전트 연결">연결</button>
            </div>
            </div>
            <p id="settings-agent-status" class="notice" role="status" hidden></p>
            <div id="calendar-settings"></div>
          </section>
          <section id="settings-templates-panel" role="tabpanel" aria-labelledby="settings-templates-tab" hidden></section>
          <p id="settings-message" class="notice app-settings-message" role="status" hidden></p>
        </div>
      </div>
    </dialog>
    <dialog id="speaker-dialog" class="speaker-dialog" aria-labelledby="speaker-dialog-title"><div id="speaker-dialog-body"></div></dialog>
    <dialog id="library-dialog" class="library-dialog" aria-labelledby="library-dialog-title"><div id="library-dialog-body"></div></dialog>
    <dialog id="transcript-actions-dialog" class="library-dialog transcript-actions-dialog" aria-labelledby="transcript-actions-title"><div id="transcript-actions-body"></div></dialog>
    <dialog id="quit-dialog" class="quit-dialog" aria-labelledby="quit-title"></dialog>
    <script type="module" src="/main.js"></script>
  </body>
</html>
