[package]
name = "nero-desktop"
version = "0.2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nero-core = { path = "../../../crates/nero-core" }
hound = "3.5.1"
rubato = "=0.16.2"
libloading = "=0.7.4"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
minisign-verify = "0.3"
semver = "1"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
base64 = "=0.22.1"
jiff = "=0.2.38"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
sha2 = "0.10"
fs2 = "0.4.3"
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }
block2 = "=0.6.2"
